# KP4              cycle sub down
# KP5              cycle sub-visibility
# KP6              cycle sub

S                screenshot video

UP               add volume 5
DOWN             add volume -5
WHEEL_UP         add volume 5
WHEEL_DOWN       add volume -5

# LEFT             seek -5 relative+exact
# RIGHT            seek 5 relative+exact
LEFT             seek -3 relative
RIGHT            seek 3 relative
Shift+RIGHT      seek 10 relative-percent
Shift+LEFT       seek -10 relative-percent
Ctrl+RIGHT       seek 30
Ctrl+LEFT        seek -30
Ctrl+Shift+RIGHT seek 60
Ctrl+Shift+LEFT  seek -60
Ctrl+Alt+RIGHT   seek 300
Ctrl+Alt+LEFT    seek -300
Ctrl+Alt+Shift+LEFT		seek -0.1 keyframes
Ctrl+Alt+Shift+RIGHT	seek 0.1 keyframes

KP0              seek 0 absolute-percent
KP1              seek 25 absolute-percent
KP2              seek 50 absolute-percent
KP3              seek 75 absolute-percent

KP_MULTIPLY      cycle-values panscan 0 0.25 0.5 0.75 1
# KP_SUBTRACT
# KP_DIVIDE

Ctrl+1           seek 10 absolute-percent
Ctrl+2           seek 20 absolute-percent
Ctrl+3           seek 30 absolute-percent
Ctrl+4           seek 40 absolute-percent
Ctrl+5           seek 50 absolute-percent
Ctrl+6           seek 60 absolute-percent
Ctrl+7           seek 70 absolute-percent
Ctrl+8           seek 80 absolute-percent
Ctrl+9           seek 90 absolute-percent
Ctrl+0           seek 95 absolute-percent

.                frame-step
,                frame-back-step

Alt+1            set video-zoom -2.5
Alt+2            set video-zoom -2.0
Alt+3            set video-zoom -1.5
Alt+4            set video-zoom -1.0
Alt+5            set video-zoom -0.6
Alt+6            set video-zoom -0.4
Alt+7            set video-zoom -0.25
Alt+8            set video-zoom 0

Alt+9			 set panscan 0
Alt+0            set panscan 1

Alt+down         add video-pan-y 0.1
Alt+up           add video-pan-y -0.1
Alt+right        cycle-values video-rotate 90 180 270 0
Alt+left         cycle-values video-rotate 270 180 90 0

# INS              show-text "${filename}"
DEL              show-progress

# Ctrl+.           show-text "${=time-pos} / ${=duration}"
Ctrl+i           script-binding stats/display-stats-toggle
Ctrl+m           script-binding console/enable
Ctrl+f           cycle fullscreen
Alt+x            quit
ESC              script-binding console/enable
SPACE            cycle pause
SHARP            cycle audio
BS               cycle-values speed 0.5 1
Ctrl+d           cycle-values pitch 0.8 0.85 0.9 1
\                change-list glsl-shaders set "~/.config/mpv/shaders/Black.glsl"
CTRL+t           set sub-scale 0.25; set sub-pos 120; set sub-gauss 2
CTRL+T           set sub-scale 1.0; set sub-pos 120; set sub-gauss 0
<                playlist-prev
>                playlist-next
